<script>
(function () {
  var sphere = document.getElementById("sphere");
  var trovato = document.getElementById("trovato");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rx = 0;
  var ry = 0;
  var scale = 1;
  var dragging = false;
  var dragMoved = false;
  var suppressClick = false;
  var lastX = 0;
  var lastY = 0;

  function paint() {
    sphere.style.transform = "rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) scale(" + scale.toFixed(3) + ")";
  }

  if (reduce) {
    sphere.removeAttribute("autoplay");
    sphere.pause();
  } else {
    var play = sphere.play();
    if (play && play.catch) play.catch(function () {});
  }

  window.addEventListener("pointerdown", function (event) {
    if (event.target.closest("a, button")) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    dragging = true;
    dragMoved = false;
    suppressClick = false;
    lastX = event.clientX;
    lastY = event.clientY;
    sphere.style.cursor = "grabbing";
  });
  window.addEventListener("pointermove", function (event) {
    if (event.target.closest("a, button") && !dragging) {
      sphere.style.cursor = "";
      return;
    }
    if (!dragging) {
      sphere.style.cursor = "grab";
      return;
    }
    var dx = event.clientX - lastX;
    var dy = event.clientY - lastY;
    if (dx * dx + dy * dy > 9) dragMoved = true;
    lastX = event.clientX;
    lastY = event.clientY;
    ry = Math.max(-16, Math.min(16, ry + dx * 0.06));
    rx = Math.max(-12, Math.min(12, rx - dy * 0.05));
    paint();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (dragMoved) suppressClick = true;
    sphere.style.cursor = "grab";
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  window.addEventListener("wheel", function (event) {
    if (event.target.closest("a, button")) return;
    event.preventDefault();
    var dy = event.deltaY;
    if (event.deltaMode === 1) dy *= 16;
    else if (event.deltaMode === 2) dy *= window.innerHeight;
    scale = Math.max(0.84, Math.min(1.22, scale * Math.exp(-dy * 0.001)));
    paint();
  }, { passive: false });
  window.addEventListener("click", function (event) {
    if (suppressClick) {
      suppressClick = false;
      return;
    }
    if (event.target.closest("a, button")) return;
    var rect = sphere.getBoundingClientRect();
    var dx = event.clientX - (rect.left + rect.width / 2);
    var dy = event.clientY - (rect.top + rect.height / 2);
    var limit = rect.width * 0.46;
    if (dx * dx + dy * dy > limit * limit) return;
    trovato.hidden = !trovato.hidden;
  });
})();

(function () {
  var dock = document.getElementById("dock");
  var button = document.getElementById("menu-btn");
  window.setTimeout(function () { dock.classList.add("visible"); }, 700);
  function setOpen(open) {
    dock.classList.toggle("open", open);
    button.setAttribute("aria-expanded", open ? "true" : "false");
    button.setAttribute("aria-label", open ? "Close the menu" : "Open the menu");
  }
  button.addEventListener("click", function () {
    setOpen(!dock.classList.contains("open"));
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") setOpen(false);
  });
})();
</script>
