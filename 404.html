<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nicola Valigi | Pagina non trovata</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060713">
<link rel="icon" href="/icona.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<style>
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 22px;
    background: #060713;
    color: #EDEBE6;
    font-family: Archivo, "Helvetica Neue", sans-serif;
    text-align: center;
  }
  .code {
    margin: 0 0 18px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: .85rem;
    letter-spacing: .2em;
    color: #F4A4C8;
  }
  h1 {
    margin: 0 0 16px;
    font-size: clamp(2.2rem, 8vw, 4rem);
    line-height: 1.1;
    letter-spacing: -.03em;
    text-wrap: balance;
  }
  h1 span { color: #FFE14A; }
  p { margin: 0 auto 30px; max-width: 40ch; color: #A0A5BA; font-size: 1.1rem; line-height: 1.6; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .2);
    color: #fff;
    text-decoration: none;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: .82rem;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  a.primary { background: #2E56FF; border-color: #4D72FF; }
  a:focus-visible { outline: 2px solid #FFE14A; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <p class="code">404 · 45.6983° N, 9.6773° E</p>
  <h1>Fuori <span>mappa.</span></h1>
  <p>Questa pagina non esiste o è stata spostata. <span lang="en">This page does not exist or has moved.</span></p>
  <div class="links">
    <a class="primary" href="/">Torna alla home</a>
    <a href="/en/" lang="en" hreflang="en">English home</a>
  </div>
</main>
</body>
</html>
