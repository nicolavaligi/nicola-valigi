<style>
  :root { --ink: #EDEBE6; --blue: #2E56FF; --quiet: #B9B5AC; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #000;
    color: var(--ink);
    font-family: Archivo, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  ::selection { background: #1F43D8; color: #fff; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

  #field {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    display: block;

  body::before {
    content: "";

    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 44%, rgba(46, 86, 255, 0.14), transparent 48%),
      radial-gradient(circle at 50% 50%, transparent 40%, #000 92%);
  }

  .stage {
    position: relative;

  .who {

  h1 .mark { color: #FFE14A; }

  .dock {

<body>
<canvas id="field" aria-hidden="true"></canvas>

<nav class="dock" id="dock">

<main class="stage">
  <p class="who">Nicola Valigi</p>
  <h1>Costruiamo<br><span class="mark">adesso.</span></h1>
</main>

<script>
(function () {
  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d");
  var count = 220;
  var nodes = [];
  var links = [];
  var golden = Math.PI * (3 - Math.sqrt(5));
  var i, a, b, dx, dy, dz, reach;

  for (i = 0; i < count; i++) {
    var y = 1 - (i / (count - 1)) * 2;
    var ring = Math.sqrt(Math.max(0, 1 - y * y));
    var theta = golden * i;
    nodes.push({
      x: Math.cos(theta) * ring,
      y: y,
      z: Math.sin(theta) * ring,
      phase: Math.random() * Math.PI * 2,
      cool: Math.random() < 0.22
    });
  }

  reach = 0.36;
  for (a = 0; a < count; a++) {
    for (b = a + 1; b < count; b++) {
      dx = nodes[a].x - nodes[b].x;
      dy = nodes[a].y - nodes[b].y;
      dz = nodes[a].z - nodes[b].z;
      if (dx * dx + dy * dy + dz * dz < reach * reach) links.push([a, b]);
    }
  }

  var width = 0;
  var height = 0;
  var ratio = 1;
  var centerX = 0;
  var centerY = 0;
  var radius = 0;
  var yaw = 0.4;
  var time = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var running = true;
  var projected = new Float32Array(count * 2);
  var depth = new Float32Array(count);
  var fire = new Float32Array(count);

  function fit() {
    ratio = Math.min(window.devicePixelRatio || 1, 2);
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    canvas.width = Math.max(1, Math.floor(width * ratio));
    canvas.height = Math.max(1, Math.floor(height * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    centerX = width / 2;
    centerY = height * 0.46;
    radius = Math.min(width, height) * 0.4;
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    var breath = 1 + (reduce ? 0 : 0.03 * Math.sin(time * 0.85));
    var span = radius * breath;
    var sinY = Math.sin(yaw);
    var cosY = Math.cos(yaw);
    var tilt = -0.32 + Math.sin(yaw * 0.45) * 0.1;
    var sinX = Math.sin(tilt);
    var cosX = Math.cos(tilt);
    var focal = 2.5;
    var n, p, x, y3, z, scale, e, i0, i1, glow, alpha, size;

    for (n = 0; n < count; n++) {
      p = nodes[n];
      x = p.x * cosY - p.z * sinY;
      z = p.x * sinY + p.z * cosY;
      y3 = p.y * cosX - z * sinX;
      z = p.y * sinX + z * cosX;
      scale = focal / (focal - z);
      projected[n * 2] = centerX + x * span * scale;
      projected[n * 2 + 1] = centerY + y3 * span * scale;
      depth[n] = (z + 1) / 2;
      fire[n] = reduce ? 0.45 : 0.5 + 0.5 * Math.sin(time * 2.1 + p.phase);
    }

    for (e = 0; e < links.length; e++) {
      i0 = links[e][0];
      i1 = links[e][1];
      glow = (fire[i0] + fire[i1]) * 0.5;
      alpha = (0.035 + glow * 0.2) * (0.28 + ((depth[i0] + depth[i1]) * 0.5) * 0.72);
      ctx.strokeStyle = "rgba(46,86,255," + alpha + ")";
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(projected[i0 * 2], projected[i0 * 2 + 1]);
      ctx.lineTo(projected[i1 * 2], projected[i1 * 2 + 1]);
      ctx.stroke();
    }

    for (n = 0; n < count; n++) {
      glow = fire[n];
      size = (0.7 + glow * 2) * (0.45 + depth[n]);
      alpha = (0.18 + glow * 0.82) * (0.3 + depth[n] * 0.7);
      ctx.fillStyle = nodes[n].cool
        ? "rgba(143,166,255," + alpha + ")"
        : "rgba(237,235,230," + alpha + ")";
      ctx.beginPath();
      ctx.arc(projected[n * 2], projected[n * 2 + 1], Math.max(size, 0.4), 0, Math.PI * 2);
      ctx.fill();
      if (glow > 0.88) {
        ctx.fillStyle = "rgba(46,86,255," + (glow - 0.88) * 1.5 + ")";
        ctx.beginPath();
        ctx.arc(projected[n * 2], projected[n * 2 + 1], Math.max(size, 0.4) * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function tick() {
    if (!running) return;
    time += 0.016;
    yaw += 0.0015;
    draw();
    if (!reduce) requestAnimationFrame(tick);
  }

  window.addEventListener("resize", function () {
    fit();
    if (reduce) draw();
  });
  document.addEventListener("visibilitychange", function () {
    running = document.visibilityState !== "hidden";
    if (running && !reduce) tick();
  });

  fit();
  tick();
})();

(function () {
  var dock = document.getElementById("dock");
  var button = document.getElementById("menu-btn");
  window.setTimeout(function () { dock.classList.add("visible"); }, 700);
  function setOpen(open) {
    dock.classList.toggle("open", open);
    button.setAttribute("aria-expanded", open ? "true" : "false");
    button.setAttribute("aria-label", open ? "Chiudi il menu" : "Apri il menu");
  }
  button.addEventListener("click", function () {
    setOpen(!dock.classList.contains("open"));
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") setOpen(false);
  });
})();
</script>
