<script>
(function () {
  var canvas = document.getElementById("sphere");
  var trovato = document.getElementById("trovato");
  var gl = canvas.getContext("webgl", { alpha: true, antialias: true, premultipliedAlpha: false });
  if (!gl) return;

  var vsSrc = [
    "attribute vec3 aPos;",
    "attribute vec3 aNrm;",
    "uniform mat4 uMvp;",
    "uniform mat3 uN;",
    "varying vec3 vN;",
    "varying vec3 vPos;",
    "void main() {",
    "  vPos = aPos;",
    "  vN = uN * aNrm;",
    "  gl_Position = uMvp * vec4(aPos, 1.0);",
    "}"
  ].join("\n");

  var fsSrc = [
    "precision mediump float;",
    "varying vec3 vN;",
    "varying vec3 vPos;",
    "uniform float uTime;",
    "uniform float uDay;",
    "uniform float uSmile;",
    "uniform vec3 uDot;",
    "uniform float uDotR;",
    "uniform vec3 uFace;",
    "uniform vec3 uUp;",
    "void main() {",
    "  vec3 n = normalize(vN);",
    "  vec3 p = normalize(vPos);",
    "  float lon = atan(p.z, p.x);",
    "  float lat = asin(clamp(p.y, -1.0, 1.0));",
    "  vec2 cell = vec2(lon * 5.0, lat * 5.0);",
    "  vec2 gv = fract(cell) - 0.5;",
    "  float puck = length(gv);",
    "  float led = smoothstep(0.46, 0.18, puck);",
    "  float bead = led * (0.55 + 0.45 * smoothstep(0.25, -0.3, gv.y));",
    "  float twinkle = 0.86 + 0.14 * sin(uTime * 1.3 + cell.x * 2.1 + cell.y * 1.7);",
    "  float band = smoothstep(0.10, 0.0, abs(lat - 0.62));",
    "  vec3 nightC = vec3(0.16, 0.42, 1.0);",
    "  vec3 dayC = vec3(1.0, 0.72, 0.32);",
    "  vec3 diode = mix(nightC, dayC, uDay);",
    "  diode = mix(diode, mix(vec3(1.0, 0.86, 0.28), vec3(1.0, 0.96, 0.72), uDay), band);",
    "  vec3 skin = diode * bead * twinkle;",
    "  vec3 key = normalize(mix(vec3(-1.05, 0.38, 0.42), vec3(-0.2, 0.95, 0.42), uDay));",
    "  float ndl = dot(n, key);",
    "  float shade = mix(smoothstep(-0.85, 0.45, ndl), 0.55 + 0.45 * clamp(ndl, 0.0, 1.0), uDay);",
    "  float facing = clamp(n.z, 0.0, 1.0);",
    "  shade *= mix(mix(0.34, 0.62, uDay), 1.0, pow(facing, 0.22));",
    "  vec3 col = skin * shade;",
    "  vec3 halfv = normalize(key + vec3(0.15, 0.35, 1.0));",
    "  float broad = pow(clamp(dot(n, halfv), 0.0, 1.0), 8.0);",
    "  float hot = pow(clamp(dot(n, halfv), 0.0, 1.0), 48.0);",
    "  vec3 spec = mix(vec3(0.45, 0.62, 1.0), vec3(1.0, 0.9, 0.62), uDay);",
    "  col += spec * broad * 0.7;",
    "  col += vec3(1.0, 0.98, 0.94) * hot;",
    "  vec3 aim = normalize(uDot);",
    "  vec3 faceAt = normalize(uFace);",
    "  vec3 up = normalize(uUp);",
    "  vec3 side = normalize(cross(up, faceAt));",
    "  vec3 upv = cross(faceAt, side);",
    "  vec2 q = vec2(dot(p - faceAt, side), dot(p - faceAt, upv));",
    "  vec2 el = (q - vec2(-0.30, 0.66)) / vec2(0.09, 0.13);",
    "  vec2 er = (q - vec2(0.30, 0.66)) / vec2(0.09, 0.13);",
    "  float eye = max(1.0 - smoothstep(0.72, 1.0, length(el)), 1.0 - smoothstep(0.72, 1.0, length(er)));",
    "  vec2 mq = q - vec2(0.0, -0.52);",
    "  float mouth = 1.0 - smoothstep(0.028, 0.062, abs(length(mq) - 0.26));",
    "  mouth *= 1.0 - smoothstep(-0.01, 0.07, mq.y);",
    "  float ink = clamp(eye + mouth, 0.0, 1.0) * step(0.25, dot(p, faceAt));",
    "  float lit = 0.36 + 0.64 * clamp(ndl * 0.55 + 0.5, 0.0, 1.0);",
    "  vec3 scol = vec3(1.0, 0.78, 0.08) * lit;",
    "  scol += vec3(1.0, 0.97, 0.72) * hot * 0.9;",
    "  scol += vec3(1.0, 0.9, 0.4) * broad * 0.3;",
    "  scol = mix(scol, vec3(0.06, 0.05, 0.04), ink);",
    "  col = mix(col, scol, uSmile);",
    "  float chord = length(p - aim);",
    "  float red = 1.0 - smoothstep(uDotR * 0.4, uDotR, chord);",
    "  col = mix(col, vec3(0.95, 0.04, 0.03), red * (1.0 - uSmile));",
    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  function shader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fsSrc));
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.bindAttribLocation(prog, 1, "aNrm");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  var slices = 120;
  var stacks = 80;
  var positions = [];
  var indices = [];
  var y, x, v, u, phi, theta, px, py, pz, row;
  for (y = 0; y <= stacks; y++) {
    v = y / stacks;
    phi = v * Math.PI;
    for (x = 0; x <= slices; x++) {
      u = x / slices;
      theta = u * Math.PI * 2;
      px = Math.sin(phi) * Math.cos(theta);
      py = Math.cos(phi);
      pz = Math.sin(phi) * Math.sin(theta);
      positions.push(px, py, pz);
    }
  }
  for (y = 0; y < stacks; y++) {
    for (x = 0; x < slices; x++) {
      row = y * (slices + 1) + x;
      indices.push(row, row + slices + 1, row + 1);
      indices.push(row + 1, row + slices + 1, row + slices + 2);
    }
  }
  var posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  var indexBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

  var uMvp = gl.getUniformLocation(prog, "uMvp");
  var uN = gl.getUniformLocation(prog, "uN");
  var uTime = gl.getUniformLocation(prog, "uTime");
  var uDay = gl.getUniformLocation(prog, "uDay");
  var uSmileU = gl.getUniformLocation(prog, "uSmile");
  var uDot = gl.getUniformLocation(prog, "uDot");
  var uDotR = gl.getUniformLocation(prog, "uDotR");
  var uFace = gl.getUniformLocation(prog, "uFace");
  var uUp = gl.getUniformLocation(prog, "uUp");
  var dot = [-0.356, 0.669, -0.653];
  var face = [0.523, 0.186, -0.832];
  var faceUp = [0, 0.976, 0.218];
  var smile = false;
  var dotScreen = { x: 0, y: 0, on: false };
  var glowTag = "";
  var yaw = 0.55;
  var pitch = -0.22;
  var userZoom = 1;
  var hitR = 200;
  var time = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var running = true;
  var dragging = false;
  var dragMoved = false;
  var suppressClick = false;
  var lastX = 0;
  var lastY = 0;
  var idleAt = 0;
  var camZ = 3.25;
  var fovy = 0.7;

  function perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2);
    var nf = 1 / (near - far);
    var o = new Float32Array(16);
    o[0] = f / aspect;
    o[5] = f;
    o[10] = (far + near) * nf;
    o[11] = -1;
    o[14] = 2 * far * near * nf;
    return o;
  }

  function mul(a, b) {
    var o = new Float32Array(16);
    var c, r;
    for (c = 0; c < 4; c++) {
      for (r = 0; r < 4; r++) {
        o[c * 4 + r] =
          a[r] * b[c * 4] +
          a[4 + r] * b[c * 4 + 1] +
          a[8 + r] * b[c * 4 + 2] +
          a[12 + r] * b[c * 4 + 3];
      }
    }
    return o;
  }

  function rotX(a) {
    var c = Math.cos(a);
    var s = Math.sin(a);
    var o = new Float32Array(16);
    o[0] = 1;
    o[5] = c;
    o[6] = s;
    o[9] = -s;
    o[10] = c;
    o[15] = 1;
    return o;
  }

  function rotY(a) {
    var c = Math.cos(a);
    var s = Math.sin(a);
    var o = new Float32Array(16);
    o[0] = c;
    o[2] = -s;
    o[5] = 1;
    o[8] = s;
    o[10] = c;
    o[15] = 1;
    return o;
  }

  function translateZ(z) {
    var o = new Float32Array(16);
    o[0] = o[5] = o[10] = o[15] = 1;
    o[14] = z;
    return o;
  }

  function scale(s) {
    var o = new Float32Array(16);
    o[0] = o[5] = o[10] = s;
    o[15] = 1;
    return o;
  }

  function mat3(m) {
    return new Float32Array([
      m[0], m[1], m[2],
      m[4], m[5], m[6],
      m[8], m[9], m[10]
    ]);
  }

  function desiredRadius() {
    var w = canvas.clientWidth;
    var h = canvas.clientHeight;
    var narrow = window.matchMedia("(max-width: 700px), (max-height: 500px)").matches;
    var d = narrow ? Math.min(Math.min(w, h) * 0.74, 460) : Math.min(Math.min(w, h) * 0.86, 980);
    return d * 0.5;
  }

  function fit() {
    var ratio = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, canvas.clientWidth);
    var h = Math.max(1, canvas.clientHeight);
    canvas.width = Math.floor(w * ratio);
    canvas.height = Math.floor(h * ratio);
    gl.viewport(0, 0, canvas.width, canvas.height);
    hitR = desiredRadius();
  }

  function dayAmount() {
    var now = new Date();
    var h = now.getHours() + now.getMinutes() / 60;
    var c = Math.cos(((h - 13) / 12) * Math.PI);
    return c > 0 ? c : 0;
  }

  function xform(m, x, y, z) {
    return [
      m[0] * x + m[4] * y + m[8] * z + m[12],
      m[1] * x + m[5] * y + m[9] * z + m[13],
      m[2] * x + m[6] * y + m[10] * z + m[14],
      m[3] * x + m[7] * y + m[11] * z + m[15]
    ];
  }

  function smilePx() {
    return Math.min(86, Math.max(48, hitR * 0.2));
  }

  function paintGlow(day) {
    var tag = (smile ? "s" : "d") + day.toFixed(2);
    if (tag === glowTag) return;
    glowTag = tag;
    var r, g, b;
    if (smile) {
      r = 255; g = 196; b = 40;
    } else {
      r = Math.round(31 + (255 - 31) * day);
      g = Math.round(67 + (150 - 67) * day);
      b = Math.round(216 + (40 - 216) * day);
    }
    canvas.style.filter =
      "drop-shadow(0 22px 28px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 42px rgba(" +
      r + "," + g + "," + b + ",0.45))";
  }

  function pointingAt(x, y) {
    if (!dotScreen.on) return false;
    var dx = x - dotScreen.x;
    var dy = y - dotScreen.y;
    var rad = (smile ? smilePx() * 0.55 : 9) + 20;
    return dx * dx + dy * dy < rad * rad;
  }

  function draw() {
    var f = 1 / Math.tan(fovy / 2);
    var zoom = (hitR * camZ) / (f * (canvas.clientHeight / 2)) * userZoom;
    var model = mul(rotY(yaw), mul(rotX(pitch), scale(zoom)));
    var view = translateZ(-camZ);
    var mv = mul(view, model);
    var proj = perspective(fovy, canvas.width / canvas.height, 0.1, 20);
    var mvp = mul(proj, mv);
    var day = dayAmount();
    var dotR = 10 / Math.max(hitR, 80);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.useProgram(prog);
    gl.uniformMatrix4fv(uMvp, false, mvp);
    gl.uniformMatrix3fv(uN, false, mat3(mv));
    gl.uniform1f(uTime, time);
    gl.uniform1f(uDay, day);
    var nrm = mat3(mv);
    var vz = nrm[2] * dot[0] + nrm[5] * dot[1] + nrm[8] * dot[2];
    gl.uniform1f(uSmileU, smile ? 1 : 0);
    gl.uniform3f(uDot, dot[0], dot[1], dot[2]);
    gl.uniform1f(uDotR, dotR);
    gl.uniform3f(uFace, face[0], face[1], face[2]);
    gl.uniform3f(uUp, faceUp[0], faceUp[1], faceUp[2]);
    gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
    var nz = vz;
    var clip = xform(mvp, dot[0], dot[1], dot[2]);
    var rect = canvas.getBoundingClientRect();
    if (clip[3] !== 0 && nz < -0.08) {
      dotScreen.on = true;
      dotScreen.x = rect.left + (clip[0] / clip[3] * 0.5 + 0.5) * rect.width;
      dotScreen.y = rect.top + (-clip[1] / clip[3] * 0.5 + 0.5) * rect.height;
    } else {
      dotScreen.on = false;
    }
    paintGlow(day);
  }

  function tick() {
    if (!running) return;
    time += 0.016;
    if (!dragging && performance.now() > idleAt && !reduce) yaw += 0.0045;
    draw();
    if (!reduce) requestAnimationFrame(tick);
  }

  window.addEventListener("resize", function () {
    fit();
    if (reduce) draw();
  });
  document.addEventListener("visibilitychange", function () {
    running = document.visibilityState !== "hidden";
    if (running && !reduce) tick();
  });

  window.addEventListener("pointerdown", function (event) {
    if (event.target.closest("a, button")) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;
    dragging = true;
    dragMoved = false;
    suppressClick = false;
    lastX = event.clientX;
    lastY = event.clientY;
    canvas.style.cursor = "grabbing";
  });
  window.addEventListener("pointermove", function (event) {
    if (event.target.closest("a, button") && !dragging) {
      canvas.style.cursor = "";
      return;
    }
    if (!dragging) {
      canvas.style.cursor = pointingAt(event.clientX, event.clientY) ? "pointer" : "grab";
      return;
    }
    var dx = event.clientX - lastX;
    var dy = event.clientY - lastY;
    if (dx * dx + dy * dy > 9) dragMoved = true;
    lastX = event.clientX;
    lastY = event.clientY;
    yaw += dx / Math.max(hitR, 80) * 1.6;
    pitch = Math.max(-1.25, Math.min(1.25, pitch + dy / Math.max(hitR, 80) * 1.2));
    idleAt = performance.now() + 2800;
    if (reduce) draw();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (dragMoved) suppressClick = true;
    canvas.style.cursor = "grab";
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  window.addEventListener("wheel", function (event) {
    if (event.target.closest("a, button")) return;
    event.preventDefault();
    var dy = event.deltaY;
    if (event.deltaMode === 1) dy *= 16;
    else if (event.deltaMode === 2) dy *= window.innerHeight;
    userZoom = Math.max(0.78, Math.min(1.35, userZoom * Math.exp(-dy * 0.001)));
    idleAt = performance.now() + 2800;
    if (reduce) draw();
  }, { passive: false });
  window.addEventListener("click", function (event) {
    if (suppressClick) {
      suppressClick = false;
      return;
    }
    if (event.target.closest("a, button")) return;
    if (smile) {
      var ball = canvas.getBoundingClientRect();
      var bx = event.clientX - (ball.left + ball.width / 2);
      var by = event.clientY - (ball.top + ball.height / 2);
      if (bx * bx + by * by <= hitR * hitR) {
        smile = false;
        document.body.classList.remove("smile");
        if (reduce) draw();
      }
      return;
    }
    if (pointingAt(event.clientX, event.clientY)) {
      var R = mul(rotY(yaw), rotX(pitch));
      face = [-R[2], -R[6], -R[10]];
      faceUp = [R[1], R[5], R[9]];
      smile = true;
      document.body.classList.add("smile");
      if (reduce) draw();
      return;
    }
    var rect = canvas.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = event.clientX - cx;
    var dy = event.clientY - cy;
    if (dx * dx + dy * dy > hitR * hitR) return;
    trovato.hidden = !trovato.hidden;
  });

  fit();
  tick();
})();

(function () {
  var dock = document.getElementById("dock");
  var button = document.getElementById("menu-btn");
  window.setTimeout(function () { dock.classList.add("visible"); }, 700);
  function setOpen(open) {
    dock.classList.toggle("open", open);
    button.setAttribute("aria-expanded", open ? "true" : "false");
    button.setAttribute("aria-label", open ? "Chiudi il menu" : "Apri il menu");
  }
  button.addEventListener("click", function () {
    setOpen(!dock.classList.contains("open"));
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") setOpen(false);
  });
})();
</script>
<script src="app.js"></script>
</body>
</html>
