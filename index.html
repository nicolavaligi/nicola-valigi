<script>
(function () {
  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d");
  var count = 220;
  var nodes = [];
  var links = [];
  var golden = Math.PI * (3 - Math.sqrt(5));
  var i, a, b, dx, dy, dz, reach;

  for (i = 0; i < count; i++) {
    var y = 1 - (i / (count - 1)) * 2;
    var ring = Math.sqrt(Math.max(0, 1 - y * y));
    var theta = golden * i;
    nodes.push({
      x: Math.cos(theta) * ring,
      y: y,
      z: Math.sin(theta) * ring,
      phase: Math.random() * Math.PI * 2,
      cool: Math.random() < 0.22
    });
  }
  nodes[73].egg = true;

  reach = 0.36;
  for (a = 0; a < count; a++) {
    for (b = a + 1; b < count; b++) {
      dx = nodes[a].x - nodes[b].x;
      dy = nodes[a].y - nodes[b].y;
      dz = nodes[a].z - nodes[b].z;
      if (dx * dx + dy * dy + dz * dz < reach * reach) links.push([a, b]);
    }
  }

  var width = 0;
  var height = 0;
  var ratio = 1;
  var centerX = 0;
  var centerY = 0;
  var radius = 0;
  var yaw = 0.4;
  var time = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var running = true;
  var projected = new Float32Array(count * 2);
  var depth = new Float32Array(count);
  var fire = new Float32Array(count);
  var eggHit = { x: 0, y: 0, r: 18 };
  var trovato = document.getElementById("trovato");

  function syncViewport() {
    var vv = window.visualViewport;
    var top = vv ? vv.offsetTop : 0;
    var viewH = vv ? vv.height : window.innerHeight;
    var bottom = Math.max(0, window.innerHeight - top - viewH);
    var rootStyle = document.documentElement.style;
    rootStyle.setProperty("--vv-top", top + "px");
    rootStyle.setProperty("--vv-height", viewH + "px");
    rootStyle.setProperty("--vv-bottom", bottom + "px");
  }

  function fit() {
    syncViewport();
    ratio = Math.min(window.devicePixelRatio || 1, 2);
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    canvas.width = Math.max(1, Math.floor(width * ratio));
    canvas.height = Math.max(1, Math.floor(height * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    var stage = document.querySelector(".stage");
    var box = stage.getBoundingClientRect();
    var canvasBox = canvas.getBoundingClientRect();
    var style = getComputedStyle(stage);
    var padTop = parseFloat(style.paddingTop) || 0;
    var padBottom = parseFloat(style.paddingBottom) || 0;
    var padLeft = parseFloat(style.paddingLeft) || 0;
    var padRight = parseFloat(style.paddingRight) || 0;
    var contentH = Math.max(1, box.height - padTop - padBottom);
    var contentW = Math.max(1, box.width - padLeft - padRight);
    centerX = (box.left + padLeft + contentW / 2) - canvasBox.left;
    centerY = (box.top + padTop + contentH / 2) - canvasBox.top;
    radius = Math.min(width, height) * 0.4;
    if (window.matchMedia("(max-width: 700px), (max-height: 500px)").matches) {
      var room = height - 56 - 48;
      var cap = room * 0.46;
      if (room > 80 && radius > cap) radius = cap;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    var breath = 1 + (reduce ? 0 : 0.03 * Math.sin(time * 0.85));
    var span = radius * breath;
    var sinY = Math.sin(yaw);
    var cosY = Math.cos(yaw);
    var tilt = -0.32 + Math.sin(yaw * 0.45) * 0.1;
    var sinX = Math.sin(tilt);
    var cosX = Math.cos(tilt);
    var focal = 2.5;
    var n, p, x, y3, z, scale, e, i0, i1, glow, alpha, size;

    for (n = 0; n < count; n++) {
      p = nodes[n];
      x = p.x * cosY - p.z * sinY;
      z = p.x * sinY + p.z * cosY;
      y3 = p.y * cosX - z * sinX;
      z = p.y * sinX + z * cosX;
      scale = focal / (focal - z);
      projected[n * 2] = centerX + x * span * scale;
      projected[n * 2 + 1] = centerY + y3 * span * scale;
      depth[n] = (z + 1) / 2;
      fire[n] = reduce ? 0.45 : 0.5 + 0.5 * Math.sin(time * 2.1 + p.phase);
    }

    for (e = 0; e < links.length; e++) {
      i0 = links[e][0];
      i1 = links[e][1];
      glow = (fire[i0] + fire[i1]) * 0.5;
      alpha = (0.035 + glow * 0.2) * (0.28 + ((depth[i0] + depth[i1]) * 0.5) * 0.72);
      ctx.strokeStyle = "rgba(46,86,255," + alpha + ")";
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(projected[i0 * 2], projected[i0 * 2 + 1]);
      ctx.lineTo(projected[i1 * 2], projected[i1 * 2 + 1]);
      ctx.stroke();
    }

    var order = [];
    for (n = 0; n < count; n++) order.push(n);
    order.sort(function (i0, i1) { return depth[i0] - depth[i1]; });

    for (n = 0; n < count; n++) {
      var index = order[n];
      glow = fire[index];
      size = (3.2 + glow * 3.4) * (0.45 + depth[index] * 0.7);
      alpha = (0.28 + glow * 0.72) * (0.35 + depth[index] * 0.65);
      var rgb = nodes[index].cool ? [143, 166, 255] : [237, 235, 230];
      if (nodes[index].egg) {
        rgb = [255, 225, 74];
        size *= 1.7;
        alpha = 1;
        eggHit.x = projected[index * 2];
        eggHit.y = projected[index * 2 + 1];
        eggHit.r = Math.max(size * 2.2, window.matchMedia("(pointer: coarse)").matches ? 28 : 16);
      }
      drawCube(
        projected[index * 2],
        projected[index * 2 + 1],
        size,
        rgb,
        alpha
      );
    }
  }

  function drawCube(x, y, s, rgb, alpha) {
    var w = s;
    var h = s * 0.55;
    function tone(factor) {
      return "rgba(" +
        Math.round(rgb[0] * factor) + "," +
        Math.round(rgb[1] * factor) + "," +
        Math.round(rgb[2] * factor) + "," +
        alpha + ")";
    }
    function face(pts, factor) {
      ctx.fillStyle = tone(factor);
      ctx.beginPath();
      ctx.moveTo(x + pts[0], y + pts[1]);
      ctx.lineTo(x + pts[2], y + pts[3]);
      ctx.lineTo(x + pts[4], y + pts[5]);
      ctx.lineTo(x + pts[6], y + pts[7]);
      ctx.closePath();
      ctx.fill();
    }
    face([-w, -h, 0, 0, 0, h, -w, 0], 0.62);
    face([w, -h, 0, 0, 0, h, w, 0], 0.8);
    face([0, -h * 2, w, -h, 0, 0, -w, -h], 1);
  }

  function tick() {
    if (!running) return;
    time += 0.016;
    yaw += 0.0015;
    draw();
    if (!reduce) requestAnimationFrame(tick);
  }

  window.addEventListener("resize", function () {
    fit();
    if (reduce) draw();
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      fit();
      if (reduce) draw();
    });
    window.visualViewport.addEventListener("scroll", function () {
      fit();
      if (reduce) draw();
    });
  }
  window.matchMedia("(max-width: 700px), (max-height: 500px)").addEventListener("change", function () {
    fit();
    if (reduce) draw();
  });
  document.addEventListener("visibilitychange", function () {
    running = document.visibilityState !== "hidden";
    if (running && !reduce) tick();
  });

  function overEgg(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var dx = clientX - rect.left - eggHit.x;
    var dy = clientY - rect.top - eggHit.y;
    return dx * dx + dy * dy <= eggHit.r * eggHit.r;
  }

  window.addEventListener("mousemove", function (event) {
    if (event.target.closest("a, button")) return;
    canvas.style.cursor = overEgg(event.clientX, event.clientY) ? "pointer" : "default";
  });
  window.addEventListener("click", function (event) {
    if (event.target.closest("a, button")) return;
    if (!overEgg(event.clientX, event.clientY)) return;
    trovato.hidden = !trovato.hidden;
  });

  fit();
  tick();
})();

(function () {
  var dock = document.getElementById("dock");
  var button = document.getElementById("menu-btn");
  window.setTimeout(function () { dock.classList.add("visible"); }, 700);
  function setOpen(open) {
    dock.classList.toggle("open", open);
    button.setAttribute("aria-expanded", open ? "true" : "false");
    button.setAttribute("aria-label", open ? "Chiudi il menu" : "Apri il menu");
  }
  button.addEventListener("click", function () {
    setOpen(!dock.classList.contains("open"));
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") setOpen(false);
  });
})();
</script>
<script src="app.js"></script>
</body>
